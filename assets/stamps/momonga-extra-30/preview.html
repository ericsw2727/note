<!doctype html><html lang="ko"><meta charset="utf-8"><title>모몽가 추가 스탬프 30종</title><style>body{font:16px system-ui;margin:24px;background:#f5f0e9;color:#344a6a}#tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px;max-width:1000px}button{border:2px solid #adcbe2;border-radius:12px;background:white;padding:6px;cursor:pointer;color:inherit}button.selected{border-color:#344a6a;background:#e8f3ff}button canvas{display:block;width:80px;height:80px;margin:auto}#paper{display:block;background:white;border:1px solid #bbb;max-width:100%;margin-top:12px;touch-action:none}</style><h1>모몽가 추가 스탬프 30종</h1><p>스탬프를 고른 뒤 흰 영역을 눌러 찍어보세요. 기존 앱과는 별도인 로컬 미리보기입니다.</p><div id="tools"></div><p><label>크기 <input id="size" type="range" min="48" max="192" value="96"></label> <button id="clear">지우기</button> <span id="status">이미지 로딩 중</span></p><canvas id="paper" width="960" height="480"></canvas><script>const frames=[{"id": "set-01-01", "name": "기쁨의 점프", "image": "set-01.png", "rect": [0, 0, 512, 512]}, {"id": "set-01-02", "name": "윙크", "image": "set-01.png", "rect": [512, 0, 512, 512]}, {"id": "set-01-03", "name": "수줍음", "image": "set-01.png", "rect": [1024, 0, 512, 512]}, {"id": "set-01-04", "name": "눈물", "image": "set-01.png", "rect": [0, 512, 512, 512]}, {"id": "set-01-05", "name": "볼 부풀리기", "image": "set-01.png", "rect": [512, 512, 512, 512]}, {"id": "set-01-06", "name": "풀이 죽음", "image": "set-01.png", "rect": [1024, 512, 512, 512]}, {"id": "set-02-01", "name": "간식 먹기", "image": "set-02.png", "rect": [0, 0, 512, 512]}, {"id": "set-02-02", "name": "차 마시기", "image": "set-02.png", "rect": [512, 0, 512, 512]}, {"id": "set-02-03", "name": "낙서하기", "image": "set-02.png", "rect": [1024, 0, 512, 512]}, {"id": "set-02-04", "name": "게임하기", "image": "set-02.png", "rect": [0, 512, 512, 512]}, {"id": "set-02-05", "name": "책 읽기", "image": "set-02.png", "rect": [512, 512, 512, 512]}, {"id": "set-02-06", "name": "음악 듣기", "image": "set-02.png", "rect": [1024, 512, 512, 512]}, {"id": "set-03-01", "name": "별 응원", "image": "set-03.png", "rect": [0, 0, 512, 512]}, {"id": "set-03-02", "name": "박수", "image": "set-03.png", "rect": [512, 0, 512, 512]}, {"id": "set-03-03", "name": "꽃 선물", "image": "set-03.png", "rect": [1024, 0, 512, 512]}, {"id": "set-03-04", "name": "축하", "image": "set-03.png", "rect": [0, 512, 512, 512]}, {"id": "set-03-05", "name": "선물 상자", "image": "set-03.png", "rect": [512, 512, 512, 512]}, {"id": "set-03-06", "name": "힘내기", "image": "set-03.png", "rect": [1024, 512, 512, 512]}, {"id": "set-04-01", "name": "하품", "image": "set-04.png", "rect": [0, 0, 512, 512]}, {"id": "set-04-02", "name": "이불 휴식", "image": "set-04.png", "rect": [512, 0, 512, 512]}, {"id": "set-04-03", "name": "꼬리 빗질", "image": "set-04.png", "rect": [1024, 0, 512, 512]}, {"id": "set-04-04", "name": "손 흔들기", "image": "set-04.png", "rect": [0, 512, 512, 512]}, {"id": "set-04-05", "name": "기지개", "image": "set-04.png", "rect": [512, 512, 512, 512]}, {"id": "set-04-06", "name": "빼꼼", "image": "set-04.png", "rect": [1024, 512, 512, 512]}, {"id": "set-05-01", "name": "우산", "image": "set-05.png", "rect": [0, 0, 512, 512]}, {"id": "set-05-02", "name": "목도리", "image": "set-05.png", "rect": [512, 0, 512, 512]}, {"id": "set-05-03", "name": "더위", "image": "set-05.png", "rect": [1024, 0, 512, 512]}, {"id": "set-05-04", "name": "반짝 눈", "image": "set-05.png", "rect": [0, 512, 512, 512]}, {"id": "set-05-05", "name": "망원경", "image": "set-05.png", "rect": [512, 512, 512, 512]}, {"id": "set-05-06", "name": "달리기", "image": "set-05.png", "rect": [1024, 512, 512, 512]}];let selected=0;const images={};const sources=[...new Set(frames.map(f=>f.image))];Promise.all(sources.map(src=>new Promise((resolve,reject)=>{const im=new Image();images[src]=im;im.onload=resolve;im.onerror=()=>reject(new Error(src));im.src=src}))).then(()=>{frames.forEach((f,i)=>{let b=document.createElement('button'),c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(images[f.image],...f.rect,0,0,96,96);b.append(c,document.createTextNode(f.name));b.onclick=()=>{selected=i;document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};if(i===0)b.classList.add('selected');tools.append(b)});document.getElementById('status').textContent='30종 준비 완료'}).catch(e=>document.getElementById('status').textContent='불러오기 실패: '+e.message);paper.onclick=e=>{let f=frames[selected],im=images[f.image];if(!im||!im.complete||!im.naturalWidth)return;let b=paper.getBoundingClientRect(),s=Number(size.value),x=(e.clientX-b.left)*paper.width/b.width,y=(e.clientY-b.top)*paper.height/b.height;paper.getContext('2d').drawImage(im,...f.rect,x-s/2,y-s/2,s,s)};document.getElementById('clear').onclick=()=>paper.getContext('2d').clearRect(0,0,paper.width,paper.height);</script></html>
