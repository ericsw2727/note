<!doctype html><html lang="ko"><meta charset="utf-8"><title>모몽가 스탬프</title><style>body{font:16px system-ui;background:#f5f0e9;color:#344a6a;padding:24px}.tools{display:flex;gap:8px;flex-wrap:wrap}button{background:white;border:2px solid #adcbe2;border-radius:12px;padding:5px;cursor:pointer}button.selected{border-color:#344a6a}button canvas{display:block;width:80px;height:80px}#paper{display:block;background:white;border:1px solid #ccc;margin-top:16px;max-width:100%;touch-action:none}</style><h1>모몽가 스탬프 6종</h1><p>스탬프를 선택하고 흰 영역을 눌러 찍어보세요. 이 미리보기에서만 동작하며 기존 앱은 변경하지 않았습니다.</p><div class="tools" id="tools"></div><p><label>크기 <input type="range" id="size" min="48" max="160" value="96"></label> <button id="clear">전체 지우기</button></p><canvas id="paper" width="800" height="450"></canvas><script>const img=new Image();img.src='stamps.png';let selected=0;const names=['인사','하트','칭찬','잠자기','놀람','뒤돌아보기'];img.onload=()=>{for(let i=0;i<6;i++){let b=document.createElement('button'),c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(img,i%3*512,Math.floor(i/3)*512,512,512,0,0,96,96);b.append(c,document.createTextNode(names[i]));b.onclick=()=>{selected=i;document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};if(i===0)b.classList.add('selected');tools.append(b)}};paper.onclick=e=>{let r=paper.getBoundingClientRect(),s=Number(size.value),x=(e.clientX-r.left)*paper.width/r.width,y=(e.clientY-r.top)*paper.height/r.height;paper.getContext('2d').drawImage(img,selected%3*512,Math.floor(selected/3)*512,512,512,x-s/2,y-s/2,s,s)};document.getElementById('clear').onclick=()=>paper.getContext('2d').clearRect(0,0,paper.width,paper.height);</script></html>
