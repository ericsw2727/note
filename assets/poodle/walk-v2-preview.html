<!doctype html><html lang="ko"><meta charset="utf-8"><title>푸들 걷기 v2 검토</title><style>body{font:16px system-ui;background:#302d2b;color:#fff8ed;padding:24px}canvas{border-bottom:2px solid #75a49b;background:#504b46}label,button{margin:12px}img{width:min(600px,95vw)}p{max-width:700px}</style><h1>푸들 걷기 v2</h1><p>뒷다리 수정본. 몸통과 발 위치가 튀는지 확인하세요. 원본 walk.png는 유지했습니다.</p><canvas id="c" width="200" height="200"></canvas><br><button id="toggle">일시정지</button><button id="next">다음 프레임</button><label>속도 <input id="speed" type="range" min="1" max="10" value="4"></label><label><input id="mirror" type="checkbox">오른쪽 방향</label><span id="status"></span><h2>전체 프레임</h2><img src="walk-v2.png"><script>const im=new Image();im.src='walk-v2.png';const ctx=c.getContext('2d');let frame=0,play=true,last=0;toggle.onclick=()=>{play=!play;toggle.textContent=play?'일시정지':'재생'};next.onclick=()=>{play=false;toggle.textContent='재생';frame=(frame+1)%4;draw()};function draw(){ctx.clearRect(0,0,200,200);ctx.save();if(mirror.checked){ctx.translate(200,0);ctx.scale(-1,1)}ctx.drawImage(im,frame%2*627,Math.floor(frame/2)*627,627,627,0,0,200,200);ctx.restore();document.getElementById('status').textContent=`${frame+1}/4 · ${speed.value} fps`}function tick(t){if(im.complete&&im.naturalWidth){if(play&&t-last>1000/Number(speed.value)){frame=(frame+1)%4;last=t}draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
