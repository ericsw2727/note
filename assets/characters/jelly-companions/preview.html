<!doctype html><html lang="ko"><meta charset="utf-8"><title>젤 캐릭터 12종</title><style>body{font:16px system-ui;background:#ece7e0;color:#493e50;padding:24px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:1100px}.card{padding:12px;border-radius:16px;background:#fff9f2;text-align:center}.card canvas{display:block;width:160px;height:160px;object-fit:contain;margin:auto}.dark .card{background:#2d303c;color:white}button{padding:8px;margin:4px;border:1px solid #baaac4;border-radius:8px;cursor:pointer}#demo{display:block;background:#343743;max-width:100%;border-bottom:6px solid #767c92}</style><h1>진주빛 젤 캐릭터 12종</h1><p>기본 포즈 에셋입니다. 개별 PNG 저장 버튼으로 해당 칸을 다운로드할 수 있습니다.</p><button id="bg">밝은/어두운 배경</button><div id="cards"></div><h2>작업표시줄 위 크기 예시</h2><p>카드를 누르면 아래에 표시합니다. 움직임 애니메이션은 없습니다.</p><canvas id="demo" width="900" height="120"></canvas><p id="status">이미지 로딩 중</p><script>const frames=[{"id": "bunny", "name": "토끼", "image": "jelly-01-04.png", "rect": [0, 0, 627, 627], "animated": false}, {"id": "bear", "name": "곰", "image": "jelly-01-04.png", "rect": [627, 0, 627, 627], "animated": false}, {"id": "cat", "name": "고양이", "image": "jelly-01-04.png", "rect": [0, 627, 627, 627], "animated": false}, {"id": "seal", "name": "물범", "image": "jelly-01-04.png", "rect": [627, 627, 627, 627], "animated": false}, {"id": "octopus", "name": "문어", "image": "jelly-05-08.png", "rect": [0, 0, 627, 627], "animated": false}, {"id": "whale", "name": "고래", "image": "jelly-05-08.png", "rect": [627, 0, 627, 627], "animated": false}, {"id": "fox", "name": "여우", "image": "jelly-05-08.png", "rect": [0, 627, 627, 627], "animated": false}, {"id": "penguin", "name": "펭귄", "image": "jelly-05-08.png", "rect": [627, 627, 627, 627], "animated": false}, {"id": "ghost", "name": "유령", "image": "jelly-09-12.png", "rect": [0, 0, 630, 623], "animated": false}, {"id": "cloud", "name": "구름", "image": "jelly-09-12.png", "rect": [630, 0, 631, 623], "animated": false}, {"id": "star", "name": "별", "image": "jelly-09-12.png", "rect": [0, 623, 630, 624], "animated": false}, {"id": "mushroom", "name": "버섯", "image": "jelly-09-12.png", "rect": [630, 623, 631, 624], "animated": false}];const images={};let selected=0;function paint(){const f=frames[selected],ctx=demo.getContext('2d');ctx.clearRect(0,0,900,120);const ratio=f.rect[2]/f.rect[3];ctx.drawImage(images[f.image],...f.rect,750,22,96*ratio,96)}Promise.all([...new Set(frames.map(f=>f.image))].map(src=>new Promise((resolve,reject)=>{const im=new Image();images[src]=im;im.onload=resolve;im.onerror=()=>reject(new Error(src));im.src=src}))).then(()=>{frames.forEach((f,i)=>{const card=document.createElement('div');card.className='card';const c=document.createElement('canvas');c.width=f.rect[2];c.height=f.rect[3];c.getContext('2d').drawImage(images[f.image],...f.rect,0,0,c.width,c.height);card.append(c,document.createTextNode(String(i+1).padStart(2,'0')+' '+f.name),document.createElement('br'));const b=document.createElement('button');b.textContent='개별 PNG 저장';b.onclick=e=>{e.stopPropagation();c.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.id+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')};card.append(b);card.onclick=()=>{selected=i;paint()};cards.append(card)});paint();document.getElementById('status').textContent='12종 준비 완료'}).catch(e=>document.getElementById('status').textContent='불러오기 실패: '+e.message);bg.onclick=()=>document.body.classList.toggle('dark');</script></html>
