<!doctype html><html lang="ko"><meta charset="utf-8"><title>젤 캐릭터 12종 움직임</title><style>
*{box-sizing:border-box}body{font:15px 'Segoe UI',sans-serif;margin:0;padding:28px;background:#20232d;color:#f3e9f6}h1{font-size:25px;margin:0 0 12px}p{color:#b9b9ca;max-width:960px;line-height:1.6}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}button{font:inherit;color:inherit;background:#333745;border:1px solid #616478;border-radius:10px;padding:8px 14px;cursor:pointer}#cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:960px}.card{padding:0 0 12px;display:flex;flex-direction:column;align-items:center;background:#30343f}.card.selected{border:2px solid #c9b4f0;background:#3a3c50}.card canvas{width:100%;max-width:200px;aspect-ratio:5/4}.card span{font-size:12px;margin-top:5px;color:#b7bed1}#stage{display:block;width:100%;max-width:960px;height:auto;background:#30343f;border-bottom:12px solid #565c71;border-radius:12px}#status{font-size:13px}.light{background:#f0ebe4;color:#4a4150}.light p{color:#73677a}.light .card,.light #stage{background:#fff9f3}.light button{background:#e4dce9;color:#4a4150}.light .card.selected{background:#ede3f4}.light .card span{color:#73677a}@media(max-width:650px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><h1>진주빛 젤 캐릭터 · 움직임 12종</h1><p>캐릭터마다 4프레임을 순서대로 재생합니다. 카드를 선택하면 아래 작업표시줄 예시에서 이동합니다. 프레임의 가로 중심과 발 아래 위치는 플레이어에서 정렬하며 원본 PNG는 유지합니다.</p><div class="controls"><button id="pause">일시정지</button><button id="step">다음 프레임</button><label>속도 <input id="speed" type="range" min="1" max="10" value="4"></label><span id="frame">1/4</span><button id="background">배경 전환</button><label><input id="travel" type="checkbox" checked>좌우 이동</label></div><div id="cards"></div><h2 id="selected">토끼</h2><canvas id="stage" width="960" height="160"></canvas><p id="status">불러오는 중</p><p>기본 움직임 에셋입니다. 기존 프로그램에는 연결하지 않았습니다. 생성형 프레임 특성상 세부 광택·형태와 발 디딤에 차이가 남을 수 있습니다.</p><script src="data.js"></script><script src="player.js"></script></html>
