<!doctype html><html lang="ko"><meta charset="utf-8"><title>만화풍 노트 스킨</title><style>body{background:#e5dfd5;font:16px system-ui;padding:24px;color:#56321f}.note{position:relative;width:300px}.skin{width:100%;display:block}.canvas{position:absolute;left:13%;top:25%;width:64%;height:48%;outline:1px dashed #ce9b65}.controls{position:absolute;left:78%;top:18%;display:flex;gap:3px}.controls img{width:14px}.tools{position:absolute;left:15%;top:83%;width:70%;height:6.5%;display:flex;align-items:center;justify-content:space-around}.tools img{width:19px}.dot{width:15px;height:15px;border:2px solid #56321f;border-radius:50%}</style><h1>4번 만화풍 노트</h1><p>300px 크기 배치 예시. 점선은 보수적으로 잡은 캔버스 안전 영역입니다. 버튼 동작은 없습니다.</p><div class="note"><img class="skin" src="notepad.png"><div class="canvas"></div><div class="controls"><img src="collapse.svg"><img src="close.svg"></div><div class="tools"><img src="pen.svg"><span class="dot" style="background:#ec9c8b"></span><span class="dot" style="background:#f0c76e"></span><span class="dot" style="background:#b5c39c"></span><span class="dot" style="background:#c5b2d0"></span><img src="eraser.svg"><img src="menu.svg"></div></div></html>
